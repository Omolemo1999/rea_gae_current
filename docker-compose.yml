services:
  postgres:
    image: postgres:17-alpine
    container_name: reagae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reagae
      POSTGRES_USER: reagae
      POSTGRES_PASSWORD: reagae_dev_password
    ports:
      - "5432:5432"
    volumes:
      - reagae_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reagae -d reagae"]
      interval: 5s
      timeout: 5s
      retries: 10

  compreface:
    image: exadel/compreface:latest
    container_name: reagae-compreface
    restart: unless-stopped
    profiles: ["face"]
    ports:
      - "8000:80"
    volumes:
      - compreface_db:/var/lib/postgresql/data

volumes:
  reagae_postgres_data:
  compreface_db:
